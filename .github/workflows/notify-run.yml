name: 配信開始メール通知の実行

# 毎日08:00 JST（23:00 UTC 前日）に app/api/notify/run を叩く。
# 実際の処理（対象作品の判定・メール送信）はサーバー側（route.ts）で行い、
# ここでは決まった時刻に1回リクエストを送るだけ。x-cron-secretで
# 認可し、GitHub Actions以外からの呼び出しを弾く。
on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

# 【2026-11-05】トークンの権限を明示する（書かないとリポジトリ既定の権限＝書き込みまで渡りうる）。
permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: notify/run を実行
        # 秘密は env で渡す（run の本文に secrets の式を直接展開しない。2026-11-05）。
        env:
          CRON_SECRET: ${{ secrets.NOTIFY_CRON_SECRET }}
        run: |
          curl -s -X POST \
            -H "x-cron-secret: $CRON_SECRET" \
            -w "\nstatus=%{http_code} time=%{time_total}s\n" \
            "https://animedia-khaki.vercel.app/api/notify/run"
