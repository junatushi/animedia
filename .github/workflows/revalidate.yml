name: 現在クールのオンデマンド再検証

# 長い裾のページ（作品・声優・サービス別・過去クール）の revalidate を1週間へ延ばした
# 代わりに、鮮度が要る**現在クールのぶんだけ**をここで明示的に古くする。
#
# 【なぜ時間ベースをやめたか】
# 2026-08-24にVercel Hobbyの ISR Writes 上限を超過しサイトがPausedになった。実測では
# Edge Requests 10,300件/日 に対し ISR Writes 9,882件/日（96%）で、リクエストのほぼ全部が
# 再生成を起こしていた。約7,051ページに1日10,300リクエストが分散すると1ページあたりの
# 再訪間隔は平均16.4時間になり、revalidate が900秒でも3600秒でもそれより遥かに短いため、
# 訪問のたびに必ず期限切れ＝毎回書き込みになっていた。
# 詳細は app/api/revalidate/route.ts の冒頭と docs/operations.md の㉝。
#
# 【2026-10-01変更・重大度高】**消したあとに必ず温める**。
# revalidatePath / revalidateTag は Vercel では対象を**消す**（staleにして裏で作り直すのでは
# ない）。アクセスが薄いサイトでは消えたまま数時間残り、**次に来た1人がその場生成の全額を
# 払う**。2026-10-01の本番計測で今期の4面の初回が33.8〜39.9秒になり、同じ計測の中で
# 消去対象でない唯一の今期面（/service/[key]/[年]/[季節]）だけが0.77秒だった＝対照群。
# 温めるのは**クール単位の面だけ**（作品ページは件数に比例するので入れない。作品数が
# 増えてもこのワークフローの仕事は増えない）。温める先は窓口の応答（`warm`）から取るので
# **ここにパスもクール名も書かない**（ズレると「温めたつもり」になる）。
#
# **温まったことを確認する**: 温めたあともう1回だけ取り、`x-vercel-cache` が
# HIT / STALE / PRERENDER のどれかであることを見る。MISS のままなら温めが効いていない
# （＝訪問者が待つ状態が残っている）ので落とす。黙って成功しないこと。
#
# クールごとに**別のリクエスト**に分けてある。窓口は対象作品を数えるために今期のライブ取得を
# 通るため1クールで数十秒かかりうる（サーバーレス関数の実行上限に当てない）。片方が失敗しても
# もう片方は続ける（基本ルール: 1件の失敗で残りを巻き添えにしない）。
# **current → next の順は変えないこと**（共有のデータキャッシュのタグを古くするのは
# current のときだけ。逆順にすると2回目の古くしで1回目に温めたぶんが冷える）。
#
# 秘密は /api/notify/run と同じ NOTIFY_CRON_SECRET を使い回す（新設しない）。
# 未設定なら本番側が401を返すだけで、サイトの表示には影響しない。
#
# GitHub Actions の schedule は数時間遅れて発火するが、この用途では日付をまたいでも
# 実害が無い（「1日に何回か現在クールを古くする」だけで、時刻に意味は無い）。
# そのため anchorToSlotDate のような基準日の固定は不要。
on:
  schedule:
    # 1日2回。1回でも鮮度としては足りるが、GitHub側の間引き（実測で約6日に1日は
    # 枠を丸ごと逃す）に備えて2回にしてある。
    - cron: "17 1,13 * * *"
  workflow_dispatch:

jobs:
  revalidate:
    runs-on: ubuntu-latest
    steps:
      - name: 現在クールと次クールを順に再検証し、そのあと温める
        env:
          BASE: https://animedia-khaki.vercel.app
          CRON_SECRET: ${{ secrets.NOTIFY_CRON_SECRET }}
        run: |
          # -f はグロブ展開を止める（温め先のURLに `?` が入るため。`?` はシェルの
          # ワイルドカードなので、たまたま一致するファイルがあると化ける）。
          set -u -f
          FAILED=0

          # **順番に意味がある**（current が先）。共有のデータキャッシュのタグ
          # （"annict" / "season-current"）は今期と次クールが同じ1枚を使うため、
          # 窓口は scope=current のときだけそれを古くする。逆順にすると
          # 2回目の古くしで1回目に温めたぶんが冷える。
          # 理由は app/api/revalidate/route.ts の該当箇所。
          for SCOPE in current next; do
            echo "::group::${SCOPE}"

            # ① 消す（窓口が「温める先」も返す）
            BODY=$(mktemp)
            STATUS=$(curl -s -X POST \
              -H "x-cron-secret: ${CRON_SECRET}" \
              -o "$BODY" -w "%{http_code}" --max-time 120 \
              "${BASE}/api/revalidate?scope=${SCOPE}")
            cat "$BODY"; echo
            if [ "$STATUS" != "200" ]; then
              echo "::error::再検証に失敗しました（scope=${SCOPE} status=${STATUS}）"
              FAILED=1
              echo "::endgroup::"
              continue
            fi

            # 温める先はすべて応答から取る（ここにパスもクール名も書かない）。
            DATA_URLS=$(jq -r '.warm.data[]?' "$BODY")
            PAGE_PATHS=$(jq -r '.warm.pages[]?' "$BODY")
            if [ -z "$PAGE_PATHS" ]; then
              echo "::error::温める先が返ってきませんでした（scope=${SCOPE}）。応答に warm.pages が無い"
              FAILED=1
              echo "::endgroup::"
              continue
            fi

            # ② データ層を先に温める（ページ側の温めが軽くなる）。
            #    /api/season は毎回計算する窓口なので x-vercel-cache は見ない。
            #    **--max-time が上限の見張りも兼ねている**: 作品数が増えてここが
            #    タイムアウトし始めたら、それは「クール一括取得が重くなった」合図。
            # `/api/season` は CDN にキャッシュされる窓口（s-maxage 付き）なので、
            # そのまま叩くと**関数が走らずCDNから返り、データ層が温まらない**
            # ＝成功と出るのに何もしていない、という最悪の形になる。
            # 毎回違うクエリを足して必ず関数を走らせる（窓口は year / season しか読まない）。
            # 窓口が返す URL は必ず `?` を含む（app/api/revalidate/route.ts の warm.data）。
            STAMP=$(date +%s)
            for u in $DATA_URLS; do
              S=$(curl -s -o /dev/null -w "%{http_code}" --max-time 180 "${BASE}${u}&_warm=${STAMP}")
              echo "data ${u} -> ${S}"
              if [ "$S" != "200" ]; then
                echo "::error::データ層を温められませんでした（${u} status=${S}）"
                FAILED=1
              fi
            done

            # ③ ページを温める → もう1回取って温まったか確認する。
            for p in $PAGE_PATHS; do
              S=$(curl -s -o /dev/null -w "%{http_code}" --max-time 180 "${BASE}${p}")
              if [ "$S" != "200" ]; then
                echo "::error::温められませんでした（${p} status=${S}）"
                FAILED=1
                continue
              fi
              CACHE=$(curl -s -o /dev/null -D - --max-time 60 "${BASE}${p}" \
                | tr -d '\r' | awk 'tolower($1)=="x-vercel-cache:"{print tolower($2)}' | tail -1)
              echo "page ${p} -> ${S} / x-vercel-cache=${CACHE:-(なし)}"
              case "$CACHE" in
                hit|stale|prerender) ;;
                *)
                  echo "::error::温めが効いていません（${p} x-vercel-cache=${CACHE:-なし}）。訪問者がその場生成を待つ状態が残っています"
                  FAILED=1
                  ;;
              esac
            done
            echo "::endgroup::"
          done

          exit "$FAILED"
