name: 依存パッケージの脆弱性の監視

# 【なぜ要るか・2026-11-05】
# Next.js 14系はサポート終了で、**今後見つかる脆弱性は14系では直らない**。放っておくと
# 新しい勧告が出ても誰も気づけないので、毎日 `npm audit --omit=dev` を回して、
# 未対応の critical/high を1本のIssueに出す。
# 判定は scripts/security-audit.js、確認済みの除外（理由と再確認の期日つき）は
# scripts/lib/security-acknowledged.js が持ち、ここには書かない。
# 手で回すときは `node scripts/security-audit.js`（npm レジストリへの通信が要る）。
#
# 【シークレット不要】コードは読み取りだけ。Issueの書き込みに GITHUB_TOKEN を使う。

on:
  schedule:
    # 1日1回。時刻は問わない（日付に依存する処理ではなく、遅れても困らない）。
    - cron: "23 18 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: security-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 終了コード2＝監査が取れていない（npmレジストリ障害など）。「取れていない」は
      # 「脆弱性ゼロ」ではないので、Issueを閉じずに、下のステップで失敗として知らせる。
      - name: 脆弱性を監査する
        id: audit
        run: |
          set +e
          node scripts/security-audit.js > "$RUNNER_TEMP/security-audit.md"
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      # 本文はファイルからfsで読む。ステップの出力やファイルの中身を `${{ }}` で
      # スクリプトに埋め込まない（本文の中身がそのままコードとして解釈されるのを避ける）。
      # Issueは1本だけにして毎日新しく積まない（毎日増える報告は数日で読まれなくなる）。
      - name: Issueを書き換える／0件なら閉じる
        uses: actions/github-script@v7
        env:
          AUDIT_EXIT_CODE: ${{ steps.audit.outputs.code }}
        with:
          script: |
            const fs = require("fs");
            const label = "security-audit";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", labels: label, per_page: 10,
            });
            const upsert = async (title, body) => {
              if (open.length > 0) {
                await github.rest.issues.update({ ...context.repo, issue_number: open[0].number, title, body });
              } else {
                await github.rest.issues.create({ ...context.repo, title, body, labels: [label] });
              }
            };

            if (process.env.AUDIT_EXIT_CODE !== "0") {
              await upsert(
                "依存パッケージの脆弱性の監査が取れていません",
                [
                  "`npm audit` の結果を取れなかったか、出力の形が想定と違いました。",
                  "**取れていないことは「脆弱性ゼロ」ではありません。**",
                  "",
                  `- ログ: ${runUrl}`,
                  "- 手で確かめるには `node scripts/security-audit.js`",
                  "",
                  "一時的な npm レジストリの障害なら、次の実行で自動的に直ります。数日続くようなら調べてください。",
                ].join("\n"),
              );
              core.setFailed("脆弱性の監査が取れていません");
              return;
            }

            const path = `${process.env.RUNNER_TEMP}/security-audit.md`;
            const body = fs.existsSync(path) ? fs.readFileSync(path, "utf8").trim() : "";
            const title = "依存パッケージに未対応の脆弱性があります";
            if (!body) {
              for (const issue of open) {
                await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: "未対応の脆弱性は0件になりました" });
                await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: "closed", state_reason: "completed" });
              }
              return;
            }
            await upsert(title, body);
