name: サイト行動ログ集計の日次取得

# 【なぜ要るか・2026-08-19】
# 自前計測（Supabase の analytics_events）は `/admin/analytics?token=...` の画面にしか
# 出ておらず、**ブラウザで開く以外に読む方法が無かった**。そのためセッション（Claude）は
# 実測値を一度も読めておらず、docs/affiliate-setup.md の「順番を決め直すときの一次情報」
# ＝「未提携サービスへのクリックが多い順に提携する」という判断が、ユーザーが手で数字を
# 写すまで止まったままだった。
# GSC（gsc-snapshot.yml）とまったく同じ形にする: 外向き通信ができる GitHub Actions から
# 取り、リポジトリにJSONを置く。以後セッションは**コミット済みのJSONを読むだけ**でよい。
#
# 取得内容は scripts/fetch-site-analytics.js（YAMLに条件を書かない）。
# セットアップ手順は docs/operations.md の「計測の見かた」。

on:
  schedule:
    # 1日1回。集計は直近30日の窓なので、時刻の精度は要らない
    # （GitHub Actions の schedule は数時間遅れる前提＝CLAUDE.md の基本ルール）。
    - cron: "10 22 * * *" # 07:10 JST 前後
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: site-analytics
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # トークン未登録の間は「静かにスキップ」する（gsc-snapshot.yml と同じ設計思想）。
      # ここで失敗させると、セットアップが済むまで毎日Issueが積み上がる。
      - name: トークンが登録されているか確認する
        id: guard
        env:
          ADMIN_DASHBOARD_TOKEN: ${{ secrets.ADMIN_DASHBOARD_TOKEN }}
        run: |
          if [ -z "$ADMIN_DASHBOARD_TOKEN" ]; then
            echo "ADMIN_DASHBOARD_TOKEN が未登録のためスキップします（docs/operations.md「計測の見かた」）。"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 行動ログ集計を取得する
        if: steps.guard.outputs.configured == 'true'
        env:
          ADMIN_DASHBOARD_TOKEN: ${{ secrets.ADMIN_DASHBOARD_TOKEN }}
        run: node scripts/fetch-site-analytics.js

      - name: 取得結果をコミットする
        if: always() && steps.guard.outputs.configured == 'true'
        run: |
          if [ -z "$(git status --porcelain content/analytics)" ]; then
            echo "差分なし。コミットしません。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/analytics
          git commit -m "サイト行動ログ集計の取得（$(date -u +%Y-%m-%d)）"
          # pushが弾かれる原因は2つあり、どちらもrebaseして1回再試行すれば通る
          # （触るファイルはワークフロー間で互いに違うので衝突しない）。
          #   ①失敗した実行を「Re-run all jobs」で押し直した場合。再実行は当時のコミットを
          #     再生するので、mainが進んでいると何度押しても弾かれる（2026-08-19に実際に発生）。
          #     押し直しは Run workflow を使うのが本筋だが、ここでも復帰できるようにしておく。
          #   ②毎日コミットするワークフロー（track-season.yml・gsc-snapshot.yml・
          #     fetch-upcoming.yml）とscheduleの遅延で実行が重なった場合。
          git push || (git pull --rebase --autostash && git push)

      # 失敗をログの中だけで終わらせない（gsc-snapshot.yml と同じ考え方）。
      - name: 失敗したらIssueに出す
        if: failure() && steps.guard.outputs.configured == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = "サイト行動ログ集計の取得が失敗しました";
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", labels: "site-analytics", per_page: 10,
            });
            const body = [
              `サイト自身の行動ログ集計（/api/admin/analytics）の日次取得が失敗しました。`,
              ``,
              `- ログ: ${url}`,
              `- 取得内容: \`scripts/fetch-site-analytics.js\` / セットアップ: \`docs/operations.md\`「計測の見かた」`,
              ``,
              `よくある原因:`,
              `- GitHub Secrets の \`ADMIN_DASHBOARD_TOKEN\` と Vercel の環境変数が食い違っている（404になる）`,
              `- \`/api/admin/analytics\` がまだデプロイされていない`,
              `- Supabase の \`analytics_events\` テーブルが無い / service role key が未設定`,
              ``,
              `一時的なエラー（429・5xx）は指数バックオフで再試行済みなので、ここまで来た失敗は恒久的なものの可能性が高いです。`,
            ].join("\n");
            if (open.length > 0) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: open[0].number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ["site-analytics"] });
            }
