name: 本番SSRの実地検査

# `node scripts/check.ts`（CI）はソースコードしか見ない。このリポジトリで最も重い事故
# （docs/operations.md ⑦-10: SEO用SSRページのHTMLが空だった件）は**ソースは正しいのに
# 本番のHTMLだけが空**という形で2週間気づかれなかったので、ソース検査だけでは足りない。
#
# ⑦-10 の再発防止として「本番HTMLを取って数える」手順は手順書に書かれたが、実行は
# 作業者の裁量のままだった。実際 2026-08-06〜08-07 の3セッション連続で持ち越され一度も
# 実行されていない。加えて、セッションを動かす環境によっては本番ドメインへの外向き通信が
# 遮断されており（2026-08-07 実測）、やろうとしてもできないことがある。
# 裁量に委ねる限り実行されないので、本番へ到達できる GitHub Actions の定期実行にした。
#
# 検査内容は scripts/verify-production.sh（YAMLに条件を書かない。ローカルからも
# `bash scripts/verify-production.sh` でそのまま回せる）。
# シークレット不要・公開URLの読み取りのみ。Annict障害では落ちない
# （本番はISR/スナップショットで応答するため）が、本番が落ちていれば落ちる＝それは
# 検知したい事象そのもの。

on:
  schedule:
    # デプロイ直後ではなく1日1回で十分（狙いは「静かに壊れて放置される」ことの防止）。
    # GitHub Actions の schedule は数時間遅れる前提（CLAUDE.md の基本ルール）だが、
    # この検査は時刻に依存しないので遅延は問題にならない。
    - cron: "17 20 * * *" # 05:17 JST 前後
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# 手動実行と定期実行が重なっても意味が無いので後発を待たせる。
concurrency:
  group: verify-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # verify-production.sh はJSONの取り出しに node（scripts/lib/json-pick.js）を使う。
      # 以前は jq を使っていたが、jq は ubuntu ランナーに最初から入っている一方で
      # Windows の開発機には無く、「CIは緑なのに手元では必ず失敗する」状態だった
      # （2026-08-11に置き換え。docs/operations.md の㉔）。
      # ランナー画像に node は同梱されているが、暗黙に頼らず版を明示しておく。
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 本番HTMLを取って検査する
        run: bash scripts/verify-production.sh

      # 逆張り巡回（2026-08-31追加）。上の検査は「実在するURLが正しく返るか」を見るが、
      # **URLの形を崩したときの振る舞い**は見ていない。2026-08-31に見つけた事故
      # （公開APIが502／10進以外のIDで同じ作品が別URLで200／範囲外の年が索引可能）は
      # どれもsitemapにもサイト内リンクにも載っていないURLで起きていた。
      # 上が失敗しても必ず走らせる（両方の結果を1回のログで見たい）。
      - name: URLの形を崩して検査する
        if: always()
        run: node scripts/patrol.js

      # 失敗をログの中だけで終わらせない（CLAUDE.md「外部に投げる処理は失敗を運用動線に
      # 出す」と同じ考え方）。schedule 失敗のメール通知は埋もれやすいため Issue に出す。
      - name: 失敗したらIssueに出す
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = "本番SSRの実地検査が失敗しました";
            // 同じ内容のIssueを毎日積み上げない。未クローズのものがあればコメントを足す。
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", labels: "production-check", per_page: 10,
            });
            const body = [
              `本番の実地検査が失敗しました。`,
              ``,
              `- ログ: ${url}`,
              `- 検査内容: \`scripts/verify-production.sh\``,
              `- 該当しそうな経緯: \`docs/operations.md\` の ⑦-10（SSRが空HTML）/ ⑯（埋め込み）/ ⑰（放送終了作品の表現）`,
              ``,
              `本番だけで起きる不具合なので、ローカルの \`node scripts/check.ts\` は通っている可能性が高いです。`,
            ].join("\n");
            if (open.length > 0) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: open[0].number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ["production-check"] });
            }
