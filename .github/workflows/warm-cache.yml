name: キャッシュ温め（今年分）

# 今年分の表示を常時速く保つための温め。対象は5種類:
#   1) /api/season … トップページ/SeasonExplorerが季節・年の切替時にクライアント側から
#      叩くAPI。データキャッシュ（lib/annict.ts の next.revalidate=600、lib/getSeasonData.ts
#      の unstable_cache 15分=900s）に加え、応答自体もCDNエッジにキャッシュされる
#      （route.ts の s-maxage=600 / stale-while-revalidate=86400、2026-07-21導入）ので、
#      ここを叩くと次の実訪問者は関数を実行せず X-Vercel-Cache: HIT（0.1s級）を引く。
#   2) /season/{year}/{season} … SEO用のSSRシーズンページ。2026-07-15にISR化
#      （revalidate=600）したので、ここを叩くとページHTMLがCDNエッジに載り、以後の
#      実訪問者は関数を実行せず X-Vercel-Cache: HIT（0.1s級）を引く。
#   3) / … トップページ。2026-07-21にISR化（searchParams依存を外し revalidate=900）した
#      ので、2) と同じくページHTMLがCDNエッジに載り実訪問者はHITを引く。ここを叩くと
#      エッジHTMLの再検証と描画関数の温めを兼ねる（以前は searchParams 依存で毎回動的
#      描画され、関数コールドで初回2秒級を踏んでいた）。
#   4) /rankings/{year}/{season} … 配信サービス勢力図・ランキングのSSRページ。
#   5) /exclusive/{year}/{season} … 独占配信まとめのSSRページ。
#      4)/5) とも2026-07-24にISR化（revalidate=600、season配下と同じパターン）。
#      現在クールのみ温める（4シーズン全部ではない。ランキング/独占配信の需要は
#      基本的に今期に集中するため）。
#   6) /anime/{id} … 作品個別ページ（2026-07-27追加）。同日にISR化した
#      （revalidate=900。それ以前は毎リクエスト動的描画で、本番実測でも常に
#      x-vercel-cache: MISS の0.42〜0.82秒。スマホでカードをタップしても画面が
#      変わらない体感の主因だった）。ここを温めると実訪問者はHITを引く
#      （ローカル本番ビルド実測: コールド0.13秒 → HIT 0.009秒）。
#      対象は現在クールの注目度（watchers）上位 WORK_LIMIT 件。トップページ・
#      ランキングページの既定の並びが watchers 降順なので、上位から温めることが
#      そのまま「利用者が最初に目にする＝タップされやすいカード」の順になる。
#      全作品（今期132件）を温めない理由は、ISRの再検証1回につきAnnictへ
#      GraphQLが1〜2本飛ぶため。上位60件なら猫と竜（42位・667人）のような
#      中位の作品まで入り、ほとんど末尾（100位=19人、132位=1人）だけが外れる。
#      末尾の作品も動かなくなるわけではなく、初回アクセスだけ従来どおり
#      1秒弱かかり、その後15分間はキャッシュに載る。件数を増やしたいときは
#      下の WORK_LIMIT を上げる（Annictへの負荷と引き換え）。
#
# これまでは 1) だけを温めており、2)/3) の「描画関数」は温まっていなかったため、
# 主要入口の / やシーズンページに久しぶりに来た訪問者がコールド起動を踏んでいた
# （実測2026-07-15: /season/2026/autumn が一度2.3s、温まると0.4s）。
#
# 対象は基本的に「今年の4シーズン」（4)/5)は現在クールのみ）。過去年はISR＋静的
# スナップショット（content/snapshots/）で既に常時速いため温め不要。5分間隔にして
# 関数インスタンス・エッジキャッシュをより温かく保ち、ディープリンク（別クール/
# 過去年）訪問者が関数コールド（実測で単発2.4s）を踏む確率を下げる狙いだが、
# 実際はGitHub Actionsのscheduleが高負荷時に間引かれ、3〜9時間毎になることが
# 判明している（2026-07-24確認）。表示速度の本線はISR（revalidate）自体であり、
# この温めはあくまで補助（コールドを引く確率を下げるだけで、無くても致命的では
# ない）と理解した上で運用する。
# データキャッシュ（getSeasonData の unstable_cache 900s）が大半を吸収するため
# Annictへの実アクセスはほぼ増えない。追加費用なし（無料枠内）。
#
# 【2026-08-05変更】5分おき → 1時間おきに落とした。
# 直近87時間の実測では、5分おき（本来1,046回）に対して実際の起動は30回だけ（約97%が
# 間引かれ、中央値2.5時間おき・最大13時間の空き）だった。つまり5分と書いても
# 効果は1時間おきと大差がない一方、投げっぱなしの待ち行列だけが積み上がる。
# この間引きは同じリポジトリの他のscheduleにも効いており、時間帯を狙って投稿する
# daily-digest.yml（docs/operations.mdの⑦-9）が枠を逃す原因になっていた。
# そちらに起動の枠を回すため、実効性能を変えずに要求回数を1/12にする。
# 効果は1〜2週間の実測で確認する（改善しなければ更に落とすか、温め自体を見直す）。
on:
  schedule:
    # 毎時0分は混雑するので分をずらす
    # 【2026-08-25変更】毎時 → 6時間おき。VercelのISR Writes上限超過でサイトが
    # Pausedになったため。この温めは「毎時、67ページを確実に書き直す」動作になっていた
    # （ページ側のrevalidateが900秒/600秒＝実行間隔60分より短いので、温めのアクセスは
    # 毎回キャッシュ期限切れに当たり、必ず再生成＝ISR書き込みを起こしていた）。
    # 実測30日で約46,000件＝ISR Writes全体の約16%をこれ単独で使っていた計算になる。
    # 落としても表示は遅くならない: ISRは期限切れ後も stale-while-revalidate で古いHTMLを
    # 即座に返し、作り直しは裏で走る。つまり「一度でも生成されたページ」は以後コールドに
    # ならない。温めが本当に効くのは「そのデプロイでまだ一度も生成されていないページ」の
    # 初回だけで、それはデプロイ直後に1回巡回すれば足りる。同時にページ側のrevalidateを
    # 3600秒へ延ばしたので、6時間おきでも実訪問者はほぼHITを引く。
    - cron: "23 */6 * * *"
  workflow_dispatch:

jobs:
  warm:
    runs-on: ubuntu-latest
    steps:
      - name: 今年分のAPI・シーズンページ・トップを温める
        run: |
          BASE="https://animedia-khaki.vercel.app"
          YEAR=$(TZ=Asia/Tokyo date +%Y)
          MONTH=$(TZ=Asia/Tokyo date +%-m)
          # lib/resolveSeasonParams.ts の seasonKeyForMonth と同じ月→クール判定
          if [ "$MONTH" -le 3 ]; then CURRENT_SEASON="winter"
          elif [ "$MONTH" -le 6 ]; then CURRENT_SEASON="spring"
          elif [ "$MONTH" -le 9 ]; then CURRENT_SEASON="summer"
          else CURRENT_SEASON="autumn"
          fi
          # トップページ（ISR化済み。エッジHTMLの再検証＋描画関数の温めを兼ねる）
          curl -s -o /dev/null -w "top / status=%{http_code} time=%{time_total}s\n" "$BASE/"
          for SEASON in winter spring summer autumn; do
            # データキャッシュ＋API関数
            curl -s -o /dev/null -w "api ${YEAR}/${SEASON} status=%{http_code} time=%{time_total}s\n" \
              "$BASE/api/season?year=${YEAR}&season=${SEASON}"
            # ISRシーズンページ（エッジキャッシュを温める → 実訪問者はHIT）
            curl -s -o /dev/null -w "page ${YEAR}/${SEASON} status=%{http_code} time=%{time_total}s\n" \
              "$BASE/season/${YEAR}/${SEASON}"
          done
          # ランキング・独占配信まとめは現在クールのみ温める（2026-07-24にISR化）
          curl -s -o /dev/null -w "page rankings ${YEAR}/${CURRENT_SEASON} status=%{http_code} time=%{time_total}s\n" \
            "$BASE/rankings/${YEAR}/${CURRENT_SEASON}"
          curl -s -o /dev/null -w "page exclusive ${YEAR}/${CURRENT_SEASON} status=%{http_code} time=%{time_total}s\n" \
            "$BASE/exclusive/${YEAR}/${CURRENT_SEASON}"

      - name: 作品ページ（現在クールの注目度上位）を温める
        run: |
          BASE="https://animedia-khaki.vercel.app"
          # 温める件数。増やすとカバー範囲が広がる代わりにAnnictへの再検証が増える。
          # 【2026-08-25変更】60 → 30。上のcron変更と同じ理由（ISR Writes上限超過）。
          # 60件は「watchers分布のカバレッジ」だけを基準に選ばれた値で、利用量の予算から
          # 逆算されていなかった。1回の巡回72リクエストのうち60件＝83%をここが占めていた。
          # 30位なら上位の注目作は変わらず入り、外れた作品も stale-while-revalidate と
          # revalidate=3600 に載るので「初回だけ1秒弱」は変わらない。
          WORK_LIMIT=30
          YEAR=$(TZ=Asia/Tokyo date +%Y)
          MONTH=$(TZ=Asia/Tokyo date +%-m)
          if [ "$MONTH" -le 3 ]; then CURRENT_SEASON="winter"
          elif [ "$MONTH" -le 6 ]; then CURRENT_SEASON="spring"
          elif [ "$MONTH" -le 9 ]; then CURRENT_SEASON="summer"
          else CURRENT_SEASON="autumn"
          fi
          # 上のステップで /api/season を叩いた直後なのでエッジHITで返る（追加負荷なし）。
          # 応答は { season, count, items: [...] } 形式。items は既に watchers 降順だが、
          # 並びの前提を持たずに済むよう念のためここでも降順に並べ直す。
          # 配列スライス（.[:$n]）ではなく limit を使う。jqの版差の影響を受けにくく、
          # watchers が欠けている作品があっても // 0 で落ちない。
          IDS=$(curl -s "$BASE/api/season?year=${YEAR}&season=${CURRENT_SEASON}" \
            | jq -r --argjson n "$WORK_LIMIT" \
              '.items | sort_by(-(.watchers // 0)) | limit($n; .[]) | .id')
          if [ -z "$IDS" ]; then
            echo "作品IDを取得できませんでした（/api/season の応答を確認）"
            exit 1
          fi
          echo "温め対象: $(echo "$IDS" | wc -l) 件"
          MISS=0
          for ID in $IDS; do
            # ISRのキャッシュエントリはHTMLとRSCペイロードが1組で書かれるため、
            # HTMLを1回叩けばカードのタップ（＝クライアント遷移でRSCを取得）も
            # HITになる（ローカル本番ビルドで実測確認済み）。
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/anime/${ID}")
            [ "$CODE" = "200" ] || { echo "anime/${ID} status=${CODE}"; MISS=$((MISS+1)); }
            # Annict側への再検証が一斉に走らないよう軽く間隔を空ける。
            sleep 0.2
          done
          echo "完了（200以外: ${MISS} 件）"
